<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Sort Animation</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --block-bg: rgba(255, 255, 255, 0.85);
            --block-text: #2c3e50;
            --block-shadow: 0 10px 25px rgba(0, 0, 0, 0.08), inset 0 0 0 1px rgba(255,255,255,0.5);
            
            --compare-bg: #fff3cd;
            --compare-border: #ffc107;
            --compare-shadow: 0 0 20px rgba(255, 193, 7, 0.4);
            
            --select-bg: #d4edda;
            --select-border: #28a745;
            
            --sorted-bg: #e8f5e9;
            --sorted-border: #4caf50;
            
            --subtitle-bg: rgba(20, 20, 20, 0.75);
            --text-zh: #ffffff;
            --text-en: #a0aec0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, #ffffff 0%, #e2e8f0 100%);
        }

        #container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Title Area */
        #header {
            position: absolute;
            top: 40px;
            left: 50px;
            z-index: 100;
        }
        #title-zh {
            font-size: 32px;
            font-weight: 800;
            color: #1a202c;
            letter-spacing: 2px;
            margin: 0;
        }
        #title-en {
            font-size: 16px;
            font-weight: 500;
            color: #718096;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Animation Canvas */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* The Number Blocks */
        .block {
            position: absolute;
            width: 6vw;
            height: 6vw;
            max-width: 65px;
            max-height: 65px;
            min-width: 45px;
            min-height: 45px;
            background: var(--block-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: var(--block-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(20px, 2.5vw, 28px);
            font-weight: 700;
            color: var(--block-text);
            /* Transform translate centers the block exactly on its left/top coordinates */
            transform: translate(-50%, -50%);
            transition: left 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        top 0.9s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.4s ease,
                        box-shadow 0.4s ease,
                        transform 0.4s ease,
                        color 0.4s ease;
            z-index: 10;
            border: 2px solid transparent;
        }

        /* States */
        .block.comparing {
            background: var(--compare-bg);
            border-color: var(--compare-border);
            box-shadow: var(--compare-shadow);
            transform: translate(-50%, -50%) scale(1.15);
            z-index: 20;
            color: #b8860b;
        }

        .block.selected {
            background: var(--select-bg);
            border-color: var(--select-border);
            transform: translate(-50%, -50%) scale(1.05);
            color: #155724;
            z-index: 15;
        }

        .block.sorted {
            background: var(--sorted-bg);
            border-color: var(--sorted-border);
            color: #2e7d32;
        }

        .block.final-success {
            animation: successPulse 1s ease-out forwards;
        }

        @keyframes successPulse {
            0% { transform: translate(-50%, -50%) scale(1); background: var(--sorted-bg); }
            50% { transform: translate(-50%, -50%) scale(1.2); background: #ffeb3b; color: #f57f17; border-color: #fbc02d; box-shadow: 0 0 30px rgba(255, 235, 59, 0.8); z-index: 30;}
            100% { transform: translate(-50%, -50%) scale(1); background: #4caf50; color: white; border-color: #388e3c; box-shadow: 0 10px 20px rgba(76, 175, 80, 0.4); }
        }

        /* Cinematic Subtitles */
        #subtitle-wrapper {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 900px;
            background: var(--subtitle-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.8s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }

        #subtitle-zh {
            font-size: 24px;
            font-weight: 500;
            color: var(--text-zh);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #subtitle-en {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-en);
            letter-spacing: 0.5px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="header">
        <h1 id="title-zh">归并排序</h1>
        <div id="title-en">Merge Sort Algorithm</div>
    </div>
    
    <div id="canvas"></div>

    <div id="subtitle-wrapper">
        <div id="subtitle-zh"></div>
        <div id="subtitle-en"></div>
    </div>
</div>

<script>
    // --- Configuration & Data ---
    const initialValues = [7, 3, 2, 8, 6, 4, 1, 5];
    let blockObjects = []; // Stores { val, dom }
    
    // Perfectly symmetrical grid coordinates for the tree
    // X positions are in vw (viewport width percentages). Center is 50.
    const X_POS = [
        [29, 35, 41, 47, 53, 59, 65, 71], // L0: Initial Array (tightly packed)
        [19, 25, 31, 37, 63, 69, 75, 81], // L1: Divided into 2 groups of 4
        [14, 20, 36, 42, 58, 64, 80, 86], // L2: Divided into 4 groups of 2
        [12, 22, 34, 44, 56, 66, 78, 88]  // L3: Divided into 8 individuals (widest spread)
    ];
    
    // Y positions are in vh (viewport height percentages)
    const Y_POS = [20, 40, 60, 80];

    // --- Utility Functions ---
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    const canvas = document.getElementById('canvas');
    const subWrapper = document.getElementById('subtitle-wrapper');
    const subZh = document.getElementById('subtitle-zh');
    const subEn = document.getElementById('subtitle-en');

    async function showSubtitle(zh, en, duration) {
        subWrapper.style.opacity = 0;
        await sleep(400); // fade out time
        subZh.innerHTML = zh;
        subEn.innerHTML = en;
        subWrapper.style.opacity = 1;
        if (duration) {
            await sleep(duration);
        }
    }

    // --- Initialization ---
    function initBlocks() {
        blockObjects = initialValues.map((val, index) => {
            const el = document.createElement('div');
            el.className = 'block';
            el.innerText = val;
            canvas.appendChild(el);
            
            // Set initial position at L0
            el.style.left = `${X_POS[0][index]}vw`;
            el.style.top = `${Y_POS[0]}vh`;
            
            return { val: val, dom: el };
        });
    }

    // --- Visual Action Functions ---
    function moveBlockToSlot(block, level, slotIndex) {
        block.dom.style.left = `${X_POS[level][slotIndex]}vw`;
        block.dom.style.top = `${Y_POS[level]}vh`;
    }

    function setClass(block, className) {
        block.dom.className = `block ${className}`;
    }

    function resetClass(block) {
        // Keep 'sorted' if it's at the very bottom, else normal
        block.dom.className = 'block';
    }

    // --- Core Algorithm Visualizer ---

    // Move an entire logical group down to a level, mapping to specific slots
    async function moveGroupDown(group, targetLevel, startSlot) {
        group.forEach((block, i) => {
            moveBlockToSlot(block, targetLevel, startSlot + i);
        });
    }

    // The Merge Function: takes two sorted arrays of block objects, visually merges them,
    // places them in the targetLevel starting at targetSlot, and returns the new sorted array.
    async function mergeGroupsVisual(groupA, groupB, targetLevel, targetSlot) {
        let sortedGroup = [];
        let i = 0, j = 0;
        let currentSlot = targetSlot;

        while (i < groupA.length && j < groupB.length) {
            const blockA = groupA[i];
            const blockB = groupB[j];

            // Highlight blocks being compared
            setClass(blockA, 'comparing');
            setClass(blockB, 'comparing');
            await sleep(800);

            if (blockA.val <= blockB.val) {
                setClass(blockB, ''); // remove highlight from loser
                setClass(blockA, 'selected');
                moveBlockToSlot(blockA, targetLevel, currentSlot);
                sortedGroup.push(blockA);
                i++;
            } else {
                setClass(blockA, '');
                setClass(blockB, 'selected');
                moveBlockToSlot(blockB, targetLevel, currentSlot);
                sortedGroup.push(blockB);
                j++;
            }
            
            currentSlot++;
            await sleep(600); // Wait for move
            
            // Cleanup selected state
            if(i > 0) setClass(groupA[i-1], 'sorted');
            if(j > 0) setClass(groupB[j-1], 'sorted');
        }

        // Move remaining blocks
        while (i < groupA.length) {
            const blockA = groupA[i];
            setClass(blockA, 'selected');
            moveBlockToSlot(blockA, targetLevel, currentSlot);
            sortedGroup.push(blockA);
            i++; currentSlot++;
            await sleep(400);
            setClass(blockA, 'sorted');
        }

        while (j < groupB.length) {
            const blockB = groupB[j];
            setClass(blockB, 'selected');
            moveBlockToSlot(blockB, targetLevel, currentSlot);
            sortedGroup.push(blockB);
            j++; currentSlot++;
            await sleep(400);
            setClass(blockB, 'sorted');
        }

        await sleep(400);
        return sortedGroup;
    }

    // --- Main Animation Sequence ---
    async function runAnimation() {
        initBlocks();
        await sleep(1000); // initial pause

        // Intro
        await showSubtitle("想象一下，你有一排杂乱无章的数字。", "Imagine you have a messy, unsorted row of numbers.", 3500);
        await showSubtitle("归并排序的秘诀在于<span style='color:#f39c12'>“分而治之”</span>(Divide & Conquer)。", "The secret of Merge Sort is 'Divide and Conquer'.", 3500);
        
        // --- DIVIDE PHASE ---
        showSubtitle("首先，我们将数组不断地从中间一分为二...", "First, we continuously divide the array in half...", 0); // Leave on screen
        
        // Level 1 Split
        await sleep(1000);
        let g0_7 = blockObjects.slice(0, 8);
        moveGroupDown(g0_7.slice(0, 4), 1, 0); // Left half to slots 0-3
        moveGroupDown(g0_7.slice(4, 8), 1, 4); // Right half to slots 4-7
        await sleep(1500);

        // Level 2 Split
        moveGroupDown(g0_7.slice(0, 2), 2, 0);
        moveGroupDown(g0_7.slice(2, 4), 2, 2);
        moveGroupDown(g0_7.slice(4, 6), 2, 4);
        moveGroupDown(g0_7.slice(6, 8), 2, 6);
        await sleep(1500);

        // Level 3 Split
        await showSubtitle("直到每个部分只剩下一个数字。", "...until each part has only one number.", 2000);
        for(let i=0; i<8; i++) {
            moveGroupDown([g0_7[i]], 3, i);
        }
        await sleep(1500);

        await showSubtitle("孤立的数字自然是<span style='color:#2ecc71'>有序的</span>！", "A single number is naturally sorted!", 2500);
        blockObjects.forEach(b => setClass(b, 'sorted')); // Turn them green
        await sleep(1000);


        // --- MERGE PHASE ---
        await showSubtitle("接下来是神奇的<span style='color:#3498db'>“归并”</span>过程。我们将相邻的部分两两合并。", "Next is the magical 'Merge' process. We merge adjacent parts in pairs.", 4000);
        showSubtitle("在合并时，比较数字大小，按顺序放入新位置。", "During merging, compare the numbers and place them in order.", 0);
        await sleep(1000);

        // Initial 8 distinct blocks
        let b0 = [g0_7[0]], b1 = [g0_7[1]], b2 = [g0_7[2]], b3 = [g0_7[3]];
        let b4 = [g0_7[4]], b5 = [g0_7[5]], b6 = [g0_7[6]], b7 = [g0_7[7]];

        // Merge L3 -> L2 (Pairs)
        let m2_0 = await mergeGroupsVisual(b0, b1, 2, 0); // merges slots 0,1 to L2 slots 0,1
        let m2_1 = await mergeGroupsVisual(b2, b3, 2, 2);
        let m2_2 = await mergeGroupsVisual(b4, b5, 2, 4);
        let m2_3 = await mergeGroupsVisual(b6, b7, 2, 6);

        await showSubtitle("局部有序的部分再次合并，像滚雪球一样越来越大...", "Partially sorted parts merge again, the snowball gets bigger...", 3000);

        // Merge L2 -> L1 (Fours)
        let m1_0 = await mergeGroupsVisual(m2_0, m2_1, 1, 0); // merges into L1 slots 0-3
        let m1_1 = await mergeGroupsVisual(m2_2, m2_3, 1, 4); // merges into L1 slots 4-7

        await showSubtitle("最终，所有的部分合并成一个完整的、有序的数组。", "Finally, all parts merge into one complete, sorted array.", 3000);

        // Merge L1 -> L0 (Final Array)
        let finalSorted = await mergeGroupsVisual(m1_0, m1_1, 0, 0);

        // Final Success Effect
        await showSubtitle("这就是归并排序，优雅且高效！", "This is Merge Sort, elegant and efficient!", 0);
        
        // Trigger a wave of success animation across the final array
        for(let i=0; i<finalSorted.length; i++) {
            finalSorted[i].dom.className = 'block final-success';
            await sleep(100);
        }
    }

    // Start animation when window loads
    window.onload = () => {
        // Slight delay before starting to ensure render is complete
        setTimeout(runAnimation, 500);
    };

</script>
</body>
</html>
