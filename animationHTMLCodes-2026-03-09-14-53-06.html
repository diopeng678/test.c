<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒泡排序 vs 插入排序 - 动画演示</title>
    <style>
        /* 全局及重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f4f8; /* 柔和的浅色背景 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 电影感容器 16:9 */
        #video-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            overflow: hidden;
        }

        /* 电影上下黑边 (增加电影感) */
        .cinematic-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 8%;
            background-color: rgba(15, 23, 42, 0.95);
            z-index: 100;
        }
        .cinematic-bar.top { top: 0; display: flex; align-items: center; padding-left: 30px;}
        .cinematic-bar.bottom { bottom: 0; }

        /* 标题 */
        #main-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* 舞台区 */
        #stage {
            position: absolute;
            top: 8%;
            bottom: 20%; /* 留出字幕空间 */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 动画元素块 */
        .block {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: #ffffff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            /* 核心动画过渡属性，保证平滑不穿模 */
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        background-color 0.4s ease, 
                        color 0.4s ease,
                        box-shadow 0.4s ease,
                        opacity 0.5s ease;
            z-index: 10;
        }

        /* 冒泡比较状态 */
        .block.bubble-compare {
            background-color: #fed7aa; /* 橙色 */
            color: #9a3412;
            box-shadow: 0 0 0 4px #fdba74, 0 10px 15px -3px rgba(0,0,0,0.1);
            transform: scale(1.05); /* 稍微放大 */
            z-index: 20;
        }

        /* 插入排序活跃状态 (被提起的元素) */
        .block.insertion-active {
            background-color: #fde047; /* 黄色 */
            color: #854d0e;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            z-index: 30;
        }

        /* 已排序状态 */
        .block.sorted {
            background-color: #bae6fd; /* 蓝色 */
            color: #0369a1;
        }
        
        /* 最终完成状态 */
        .block.finished {
            background-color: #bbf7d0; /* 绿色 */
            color: #166534;
        }

        /* 字幕区域 */
        #subtitle-container {
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            text-align: center;
            z-index: 110;
            pointer-events: none;
        }

        .subtitle {
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #subtitle-zh {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        #subtitle-en {
            color: #cbd5e1;
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* 装饰性背景元素 */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            z-index: 1;
        }
        .circle-1 { width: 400px; height: 400px; background: #93c5fd; top: -100px; left: -100px; }
        .circle-2 { width: 300px; height: 300px; background: #fca5a5; bottom: 100px; right: -50px; }

        /* 结束画面 */
        #outro {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.95);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }
        #outro h1 { color: #1e293b; font-size: 3rem; margin-bottom: 1rem; }
        #outro p { color: #64748b; font-size: 1.2rem; }

    </style>
</head>
<body>

    <div id="video-container">
        <div class="cinematic-bar top">
            <div id="main-title">Sorting Algorithms</div>
        </div>
        
        <!-- 背景装饰 -->
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>

        <div id="stage">
            <!-- 动态生成的方块将在这里 -->
        </div>

        <div class="cinematic-bar bottom"></div>

        <div id="subtitle-container">
            <div id="subtitle-zh" class="subtitle"></div>
            <div id="subtitle-en" class="subtitle"></div>
        </div>

        <div id="outro">
            <h1>动画结束</h1>
            <p>Thanks for watching</p>
        </div>
    </div>

    <script>
        // --- 核心引擎与状态管理 ---
        const stage = document.getElementById('stage');
        const titleEl = document.getElementById('main-title');
        const subZhEl = document.getElementById('subtitle-zh');
        const subEnEl = document.getElementById('subtitle-en');
        
        const BLOCK_WIDTH = 70;
        const GAP = 20;
        const STEP = BLOCK_WIDTH + GAP; // 90px

        let blocksState = []; // 存储当前方块的对象数组

        // 异步等待函数 (控制时间轴)
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // 设置字幕
        async function setSubtitle(zh, en, duration = 0) {
            subZhEl.style.opacity = 0;
            subEnEl.style.opacity = 0;
            await sleep(400); // 淡出时间
            
            subZhEl.innerText = zh;
            subEnEl.innerText = en;
            
            subZhEl.style.opacity = 1;
            subEnEl.style.opacity = 1;

            if (duration > 0) {
                await sleep(duration);
            }
        }

        // 设置标题
        function setTitle(text) {
            titleEl.style.opacity = 0;
            setTimeout(() => {
                titleEl.innerText = text;
                titleEl.style.opacity = 1;
            }, 500);
        }

        // 初始化/重置数组
        function createArray(values) {
            stage.innerHTML = '';
            blocksState = [];
            const offset = (values.length - 1) / 2; // 用于居中计算

            values.forEach((val, i) => {
                const el = document.createElement('div');
                el.className = 'block';
                el.innerText = val;
                
                // 计算X坐标使整体居中
                const x = (i - offset) * STEP;
                const y = 0;
                
                // 初始位置稍微偏下并透明，用于入场动画
                el.style.transform = `translate(${x}px, 50px)`;
                el.style.opacity = 0;
                
                stage.appendChild(el);

                blocksState.push({
                    el: el,
                    val: val,
                    x: x,
                    y: y,
                    logicalIndex: i // 在数组中的逻辑位置
                });

                // 触发入场动画
                setTimeout(() => {
                    el.style.transform = `translate(${x}px, ${y}px)`;
                    el.style.opacity = 1;
                }, i * 150 + 100);
            });
        }

        // 清除舞台
        async function clearStage() {
            blocksState.forEach(b => {
                b.el.style.transform = `translate(${b.x}px, -100px)`;
                b.el.style.opacity = 0;
            });
            await sleep(600);
            stage.innerHTML = '';
            blocksState = [];
        }

        // --- 冒泡排序专属动画动作 ---

        // 高亮比较的两个元素
        function highlightBubble(idx1, idx2) {
            blocksState[idx1].el.classList.add('bubble-compare');
            blocksState[idx2].el.classList.add('bubble-compare');
            // 更新一下 transform 以应用 scale，保留原有的 translate
            blocksState[idx1].el.style.transform = `translate(${blocksState[idx1].x}px, ${blocksState[idx1].y}px) scale(1.1)`;
            blocksState[idx2].el.style.transform = `translate(${blocksState[idx2].x}px, ${blocksState[idx2].y}px) scale(1.1)`;
        }

        // 移除高亮
        function unhighlightBubble(idx1, idx2) {
            blocksState[idx1].el.classList.remove('bubble-compare');
            blocksState[idx2].el.classList.remove('bubble-compare');
            blocksState[idx1].el.style.transform = `translate(${blocksState[idx1].x}px, ${blocksState[idx1].y}px)`;
            blocksState[idx2].el.style.transform = `translate(${blocksState[idx2].x}px, ${blocksState[idx2].y}px)`;
        }

        // 交换两个元素的位置 (视觉和逻辑)
        async function swap(idx1, idx2) {
            const b1 = blocksState[idx1];
            const b2 = blocksState[idx2];

            // 交换X坐标
            const tempX = b1.x;
            b1.x = b2.x;
            b2.x = tempX;

            // 执行动画 (为了避免穿模，让一个稍微往下绕一下)
            b1.el.style.transform = `translate(${b1.x}px, 20px) scale(1.1)`;
            b2.el.style.transform = `translate(${b2.x}px, -20px) scale(1.1)`;

            await sleep(300); // 走到一半

            b1.el.style.transform = `translate(${b1.x}px, 0px) scale(1.1)`;
            b2.el.style.transform = `translate(${b2.x}px, 0px) scale(1.1)`;

            // 逻辑数组交换
            blocksState[idx1] = b2;
            blocksState[idx2] = b1;
            b1.logicalIndex = idx2;
            b2.logicalIndex = idx1;

            await sleep(400); // 等待动画完成
        }

        function markSorted(idx) {
            blocksState[idx].el.classList.add('sorted');
        }

        // --- 插入排序专属动画动作 ---

        // 提起元素
        async function pickUp(idx) {
            const b = blocksState[idx];
            b.y = -100; // 向上提起的距离
            b.el.classList.add('insertion-active');
            b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
            await sleep(600);
        }

        // 向右平移腾出空间
        async function shiftRight(idx) {
            const b = blocksState[idx];
            b.x += STEP;
            b.logicalIndex += 1;
            b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
            // 更新逻辑数组，位置后移
            blocksState[b.logicalIndex] = b;
        }

        // 放下元素到目标位置
        async function dropDown(activeObj, targetLogicalIdx, totalElements) {
            const offset = (totalElements - 1) / 2;
            const newX = (targetLogicalIdx - offset) * STEP;
            
            activeObj.x = newX;
            activeObj.y = 0;
            activeObj.logicalIndex = targetLogicalIdx;
            
            // 先平移到目标正上方
            activeObj.el.style.transform = `translate(${activeObj.x}px, -100px)`;
            await sleep(400);

            // 放下
            activeObj.el.classList.remove('insertion-active');
            activeObj.el.style.transform = `translate(${activeObj.x}px, ${activeObj.y}px)`;
            
            blocksState[targetLogicalIdx] = activeObj;
            await sleep(500);
        }

        function markAllFinished() {
            blocksState.forEach(b => {
                b.el.className = 'block finished';
                b.el.style.transform = `translate(${b.x}px, 0px) scale(1.05)`;
            });
            setTimeout(() => {
                blocksState.forEach(b => b.el.style.transform = `translate(${b.x}px, 0px) scale(1)`);
            }, 300);
        }


        // ==========================================
        // 主时间轴：导演脚本
        // ==========================================
        async function playAnimation() {
            // --- 场景 1：开场 ---
            setTitle("Sorting Algorithms");
            await setSubtitle("想象你有一排乱序的箱子需要整理", "Imagine you have a row of unsorted boxes to organize.", 3000);
            
            createArray([5, 3, 4, 1, 2]);
            await sleep(1500);

            await setSubtitle("今天我们来看看两种经典方法的区别", "Today we look at the difference between two classic methods.", 3000);

            // --- 场景 2：冒泡排序 ---
            await clearStage();
            setTitle("Bubble Sort | 冒泡排序");
            createArray([5, 3, 4, 1, 2]);
            await sleep(1500);

            await setSubtitle("冒泡排序的特点是：只比较相邻的两个邻居", "Bubble sort's feature: it only compares adjacent neighbors.", 3500);

            // 演示一轮冒泡
            highlightBubble(0, 1);
            await setSubtitle("比较 5 和 3。5更大，所以它们交换位置", "Compare 5 and 3. 5 is larger, so they swap.", 1500);
            await swap(0, 1);
            unhighlightBubble(0, 1);
            await sleep(500);

            highlightBubble(1, 2);
            await setSubtitle("继续比较 5 和 4。5更大，再次交换", "Continue comparing 5 and 4. 5 is larger, swap again.", 1500);
            await swap(1, 2);
            unhighlightBubble(1, 2);
            await sleep(500);

            highlightBubble(2, 3);
            await setSubtitle("就像水里的气泡一样...", "Just like bubbles in the water...", 1000);
            await swap(2, 3);
            unhighlightBubble(2, 3);
            await sleep(500);

            highlightBubble(3, 4);
            await setSubtitle("最大的数字盲目地一路'冒泡'到了最后", "The largest number blindly 'bubbles' all the way to the end.", 1500);
            await swap(3, 4);
            unhighlightBubble(3, 4);
            
            markSorted(4); // 5 归位
            await sleep(2000);


            // --- 场景 3：插入排序 ---
            await clearStage();
            setTitle("Insertion Sort | 插入排序");
            // 使用一个新的数组，方便演示插入
            createArray([4, 3, 5, 1, 2]);
            await sleep(1500);

            await setSubtitle("插入排序不同，它会在左侧建立一个'已排序区'", "Insertion sort is different; it builds a 'sorted zone' on the left.", 3500);
            
            markSorted(0); // 4 默认已排序
            await setSubtitle("第一个元素默认已排序", "The first element is sorted by default.", 2000);

            await setSubtitle("然后，它挑出下一个元素...", "Then, it picks up the next element...", 1000);
            const pickedObj1 = blocksState[1]; // 记住要插入的对象
            await pickUp(1);
            
            await setSubtitle("扫描已排序区，发现 4 比 3 大", "Scans the sorted zone, finds 4 is greater than 3.", 2000);
            await setSubtitle("于是把 4 向右挪动，腾出空间", "So it shifts 4 to the right to make room.", 500);
            await shiftRight(0); // 把索引0的元素(4)向右移
            await sleep(500);

            await setSubtitle("最后把 3 精准地插入到正确的位置", "Finally, precisely inserts 3 into the correct spot.", 1000);
            await dropDown(pickedObj1, 0, 5); // 把挑起的元素放到索引0
            markSorted(0);
            markSorted(1);
            await sleep(2000);

            // 再演示一次跳跃的插入，展示其目的性
            await setSubtitle("如果遇到已经比前面大的元素 (比如5)", "If it encounters an element already larger (like 5)", 2000);
            markSorted(2); // 5 直接归位
            await sleep(1000);

            await setSubtitle("我们来看看 1 会发生什么", "Let's see what happens to 1.", 1500);
            const pickedObj2 = blocksState[3]; // 元素 1
            await pickUp(3);

            await setSubtitle("它有目的地寻找自己的位置...", "It purposefully seeks its own position...", 1500);
            
            // 连贯右移
            await shiftRight(2); // 移 5
            await sleep(200);
            await shiftRight(1); // 移 4
            await sleep(200);
            await shiftRight(0); // 移 3
            await sleep(500);

            await setSubtitle("一步到位，直接插入", "Done in one step, directly inserted.", 1000);
            await dropDown(pickedObj2, 0, 5);
            markSorted(0);
            markSorted(1);
            markSorted(2);
            markSorted(3);
            await sleep(2000);

            // 收尾数组
            const pickedObj3 = blocksState[4]; // 元素 2
            await pickUp(4);
            await shiftRight(3); // 移 5
            await sleep(100);
            await shiftRight(2); // 移 4
            await sleep(100);
            await shiftRight(1); // 移 3
            await dropDown(pickedObj3, 1, 5);
            
            markAllFinished();
            await setSubtitle("排序完成！", "Sorting complete!", 2500);


            // --- 场景 4：核心总结 ---
            await clearStage();
            setTitle("Core Difference | 核心区别");
            await sleep(1000);

            await setSubtitle("冒泡排序：盲目比较相邻元素，频繁做无用交换。", "Bubble Sort: Blindly compares neighbors, frequent useless swaps.", 4000);
            await setSubtitle("插入排序：有目的地扫描并腾出空间，精准插入。", "Insertion Sort: Purposefully scans and makes room, inserts precisely.", 4000);
            await setSubtitle("因此，对于大部分已经有序的数据...", "Therefore, for mostly sorted data...", 3000);
            await setSubtitle("插入排序的效率通常远高于冒泡排序！", "Insertion sort is usually much more efficient than bubble sort!", 4000);

            // --- 结束 ---
            subZhEl.style.opacity = 0;
            subEnEl.style.opacity = 0;
            document.getElementById('outro').style.opacity = 1;
        }

        // 页面加载完成后延迟一下自动开始
        window.onload = () => {
            setTimeout(playAnimation, 1000);
        };

    </script>
</body>
</html>
