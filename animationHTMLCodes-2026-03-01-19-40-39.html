<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函数栈帧的创建 | Function Stack Frame Creation</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #334155;
            --text-light: #64748b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-purple: #8b5cf6;
            --frame-main: #e0f2fe;
            --frame-add: #d1fae5;
            --block-bg: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            height: 80vh;
            display: flex;
            position: relative;
            background: white;
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Left Side: Animation Area */
        .animation-area {
            flex: 6;
            position: relative;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 100px;
        }

        /* Right Side: Code Area */
        .code-area {
            flex: 4;
            background: #ffffff;
            border-left: 1px solid #e2e8f0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .code-block {
            font-family: 'Courier New', Courier, monospace;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            line-height: 1.6;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .code-line {
            transition: all 0.3s;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .code-line.active {
            background-color: #bfdbfe;
            font-weight: bold;
        }

        /* Stack Elements */
        .stack-container {
            width: 300px;
            position: relative;
            display: flex;
            flex-direction: column-reverse; /* Stack grows up visually */
            align-items: center;
        }

        .stack-block {
            width: 100%;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(-30px);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-bottom: 4px;
            position: relative;
            box-sizing: border-box;
            border: 2px solid transparent;
        }

        .stack-block.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .frame-main {
            background-color: var(--frame-main);
            color: #0369a1;
            height: 150px;
            border-color: #bae6fd;
        }

        .block-param {
            background-color: #fef3c7;
            color: #b45309;
            height: 50px;
            border-color: #fde68a;
        }

        .block-ret {
            background-color: #f3e8ff;
            color: #7e22ce;
            height: 50px;
            border-color: #e9d5ff;
        }

        .block-ebp {
            background-color: #fee2e2;
            color: #b91c1c;
            height: 50px;
            border-color: #fecaca;
        }

        .frame-local {
            background-color: var(--frame-add);
            color: #047857;
            height: 0px; /* Initially 0 */
            border-color: #a7f3d0;
            transition: height 1s ease-in-out;
        }

        /* Pointers */
        .pointer {
            position: absolute;
            left: -120px;
            display: flex;
            align-items: center;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.2rem;
            transition: bottom 0.8s ease-in-out;
            opacity: 0;
        }

        .pointer::after {
            content: '→';
            margin-left: 10px;
            font-size: 1.5rem;
        }

        #ptr-ebp { color: var(--accent-purple); bottom: 20px; }
        #ptr-esp { color: var(--accent-blue); bottom: 120px; }

        /* Subtitles */
        .subtitle-container {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .subtitle {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 40px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            backdrop-filter: blur(5px);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .subtitle.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .sub-zh {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .sub-en {
            font-size: 1rem;
            color: var(--text-light);
        }

        /* Overlay for cinematic start */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-main);
            transition: opacity 1s;
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay">
        <div>函数栈帧的创建 <br><span style="font-size: 1rem; color: #64748b;">Creation of Function Stack Frame</span></div>
    </div>

    <div class="container">
        <div class="animation-area">
            <div class="stack-container" id="stack">
                <!-- Stack elements will be injected here -->
                <div class="pointer" id="ptr-ebp">EBP</div>
                <div class="pointer" id="ptr-esp">ESP</div>
            </div>
            
            <div class="subtitle-container">
                <div class="subtitle" id="subtitle-box">
                    <div class="sub-zh" id="sub-zh"></div>
                    <div class="sub-en" id="sub-en"></div>
                </div>
            </div>
        </div>

        <div class="code-area">
            <h2 style="margin-top:0; color: var(--accent-blue);">C Code</h2>
            <div class="code-block">
                <div class="code-line" id="code-1">int add(int a, int b) {</div>
                <div class="code-line" id="code-2">&nbsp;&nbsp;int sum = a + b;</div>
                <div class="code-line" id="code-3">&nbsp;&nbsp;return sum;</div>
                <div class="code-line" id="code-4">}</div>
                <br>
                <div class="code-line" id="code-5">void main() {</div>
                <div class="code-line" id="code-6">&nbsp;&nbsp;...</div>
                <div class="code-line" id="code-7">&nbsp;&nbsp;int res = add(1, 2);</div>
                <div class="code-line" id="code-8">&nbsp;&nbsp;...</div>
                <div class="code-line" id="code-9">}</div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const stack = document.getElementById('stack');
        const ptrEbp = document.getElementById('ptr-ebp');
        const ptrEsp = document.getElementById('ptr-esp');
        const subZh = document.getElementById('sub-zh');
        const subEn = document.getElementById('sub-en');
        const subBox = document.getElementById('subtitle-box');
        
        // Helper to calculate height for pointers
        let currentEspBottom = 0;
        let currentEbpBottom = 0;

        function updateSubtitle(zh, en) {
            subBox.classList.remove('visible');
            setTimeout(() => {
                subZh.innerHTML = zh;
                subEn.innerHTML = en;
                subBox.classList.add('visible');
            }, 300);
        }

        function highlightCode(id) {
            document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
            if(id) document.getElementById(id).classList.add('active');
        }

        function addStackBlock(id, className, text, height) {
            const block = document.createElement('div');
            block.className = `stack-block ${className}`;
            block.id = id;
            block.innerHTML = text;
            if(height) block.style.height = height + 'px';
            stack.appendChild(block);
            
            // Trigger reflow for animation
            void block.offsetWidth; 
            block.classList.add('visible');

            currentEspBottom += (height || 50) + 4; // +4 for margin
            return block;
        }

        function movePointer(ptr, bottomVal) {
            ptr.style.opacity = '1';
            ptr.style.bottom = bottomVal + 'px';
        }

        // Timeline Script
        const timeline = [
            {
                delay: 1500,
                action: () => {
                    document.getElementById('overlay').style.opacity = '0';
                    setTimeout(() => document.getElementById('overlay').style.display = 'none', 1000);
                }
            },
            {
                delay: 2000,
                action: () => {
                    updateSubtitle("欢迎！今天我们通过动画看看函数调用时，内存中的“栈帧”是如何创建的。", "Welcome! Today we'll see how a 'Stack Frame' is created in memory during a function call.");
                    highlightCode('code-5');
                }
            },
            {
                delay: 5000,
                action: () => {
                    updateSubtitle("假设 main 函数正在运行，它拥有自己的工作区（栈帧）。", "Assume the main function is running, it has its own workspace (stack frame).");
                    addStackBlock('main-frame', 'frame-main', 'main() 栈帧<br><span style="font-size:0.8rem; font-weight:normal">Local Variables</span>', 150);
                    currentEbpBottom = 0; 
                    currentEspBottom = 154;
                    movePointer(ptrEbp, 75); // visually point to middle of main
                    movePointer(ptrEsp, 154);
                }
            },
            {
                delay: 5000,
                action: () => {
                    updateSubtitle("现在，main 准备调用 add(1, 2) 函数。", "Now, main is about to call the add(1, 2) function.");
                    highlightCode('code-7');
                }
            },
            {
                delay: 4000,
                action: () => {
                    updateSubtitle("第一步：传递参数。参数通常从右向左压入栈中。", "Step 1: Pass arguments. Arguments are usually pushed onto the stack from right to left.");
                    addStackBlock('param-2', 'block-param', '参数 2 (b=2)', 50);
                    movePointer(ptrEsp, currentEspBottom);
                }
            },
            {
                delay: 2000,
                action: () => {
                    addStackBlock('param-1', 'block-param', '参数 1 (a=1)', 50);
                    movePointer(ptrEsp, currentEspBottom);
                }
            },
            {
                delay: 3500,
                action: () => {
                    updateSubtitle("第二步：压入返回地址。这样 add 执行完才知道回到哪里。", "Step 2: Push the Return Address. So add knows where to go back after execution.");
                    addStackBlock('ret-addr', 'block-ret', '返回地址 (Return Addr)', 50);
                    movePointer(ptrEsp, currentEspBottom);
                }
            },
            {
                delay: 4500,
                action: () => {
                    updateSubtitle("现在正式进入 add 函数！开始构建新栈帧。", "Now officially entering the add function! Starting to build the new stack frame.");
                    highlightCode('code-1');
                }
            },
            {
                delay: 4000,
                action: () => {
                    updateSubtitle("第三步：保存旧的 EBP。也就是记住 main 栈帧的底部在哪。", "Step 3: Save the old EBP. This remembers where the bottom of main's frame is.");
                    addStackBlock('old-ebp', 'block-ebp', '旧 EBP (Saved EBP)', 50);
                    movePointer(ptrEsp, currentEspBottom);
                }
            },
            {
                delay: 5000,
                action: () => {
                    updateSubtitle("第四步：将 EBP 移动到当前的 ESP。这标志着新栈帧的底部！", "Step 4: Move EBP to the current ESP. This marks the base of the new stack frame!");
                    // EBP moves to where ESP currently is
                    currentEbpBottom = currentEspBottom - 25; // point to middle of saved EBP
                    movePointer(ptrEbp, currentEspBottom - 25); 
                }
            },
            {
                delay: 5000,
                action: () => {
                    updateSubtitle("第五步：ESP 向上移动，为 add 函数的局部变量开辟空间。", "Step 5: ESP moves up to allocate space for local variables of the add function.");
                    highlightCode('code-2');
                    const localBlock = addStackBlock('local-vars', 'frame-local', 'add() 局部变量<br><span style="font-size:0.8rem; font-weight:normal">(sum)</span>', 0);
                    
                    // Animate height expansion
                    setTimeout(() => {
                        localBlock.style.height = '100px';
                        currentEspBottom += 100;
                        movePointer(ptrEsp, currentEspBottom);
                    }, 100);
                }
            },
            {
                delay: 5000,
                action: () => {
                    updateSubtitle("完美！属于 add 函数的全新栈帧创建完毕，它可以开始工作了！", "Perfect! A brand new stack frame for the add function is created, and it can start working!");
                    document.getElementById('local-vars').style.backgroundColor = '#10b981';
                    document.getElementById('local-vars').style.color = '#ffffff';
                }
            }
        ];

        // Engine to run timeline
        let currentTime = 0;
        timeline.forEach(step => {
            currentTime += step.delay;
            setTimeout(step.action, currentTime);
        });

    </script>
</body>
</html>
